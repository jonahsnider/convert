name: CI

on: [push, pull_request]

permissions:
  contents: write
  pull-requests: write

jobs:
  size-limit:
    name: Size Limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - name: Build bundle
        run: pnpm bundle
      - name: Size Limit
        if: github.event_name == 'pull_request'
        uses: andresz1/size-limit-action@e7493a72a44b113341c0cf6186ab49c17c4b65c1 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install
      - name: Size Limit
        if: github.event_name == 'push'
        run: pnpm size-limit

  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - name: Generate source
        run: pnpm generate
      - parallel:
          - name: Build and validate API
            run: pnpm build:ci
            env:
              CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          - name: Check formatting
            run: pnpm format
          - name: Check unused code and dependencies
            run: pnpm knip
          - name: Lint
            run: pnpm lint
          - name: Test
            run: pnpm test
            env:
              CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  benchmarks:
    name: Benchmarks

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - name: Prepare to run benchmarks
        run: pnpm generate
      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: 'pnpm vitest bench --run'
          mode: 'simulation'
