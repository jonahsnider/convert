name: autofix.ci # needed to securely identify the workflow

on: [push, pull_request]

permissions:
  contents: read

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true
      - name: Apply formatting fixes
        run: pnpm format:fix
        continue-on-error: true
      - name: Apply lint fixes
        run: pnpm lint:fix
        continue-on-error: true
      - name: Apply Knip fixes
        run: pnpm knip -- --fix
        continue-on-error: true
      - name: Run autofix.ci
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
        with:
          commit-message: 'refactor: apply automatic fixes'
